name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install verified environment
        run: python -m pip install -c constraints/python312.txt -e '.[dev,train]'
      - name: Run scientific invariant tests
        run: python -m pytest -q
      - name: Verify public release
        run: python -m scripts.verify_release --root .
